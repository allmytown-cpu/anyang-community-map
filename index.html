<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>커뮤니티매핑 프로토타입 - 안양천변</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; font-family: -apple-system, "Malgun Gothic", sans-serif; }
  #map { height: 100%; width: 100%; }
  .info-box {
    position: absolute; top: 10px; left: 50px; z-index: 1000;
    background: white; padding: 10px 16px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25); font-size: 13px; max-width: 260px;
  }
  .info-box h3 { margin: 0 0 6px 0; font-size: 15px; }
  .num-badge {
    background:#4472C4; color:white; border-radius:50%;
    width:22px; height:22px; display:inline-flex; align-items:center;
    justify-content:center; font-weight:bold; font-size:12px; margin-right:6px;
  }
  .popup-content { font-size: 13px; line-height: 1.5; max-width:220px; }
  .popup-content img { width:100%; max-height:400px; object-fit:cover; border-radius:6px; margin-bottom:6px; display:block; cursor:pointer; }
  .popup-content b { color:#4472C4; }
  .popup-no-photo { background:#f0f0f0; color:#888; text-align:center; padding:40px 0; border-radius:6px; margin-bottom:6px; font-size:12px; }

  .lightbox { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.85);
    align-items:center; justify-content:center; }
  .lightbox.show { display:flex; }
  .lightbox img { max-width:90vw; max-height:90vh; object-fit:contain; border-radius:4px; }
  .lightbox-close { position:absolute; top:16px; right:20px; color:white; font-size:32px;
    cursor:pointer; line-height:1; user-select:none; }
  .lightbox-close:hover { color:#ccc; }
</style>
</head>
<body>
<div class="info-box">
  <h3>📍 안양천변 도보 경로</h3>
  <span id="infoText">엑셀 파일을 불러오는 중...</span>
</div>
<div id="map"></div>
<div id="lightbox" class="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <img id="lightboxImg" src="" alt="확대된 사진"/>
</div>

<script>
const map = L.map('map').setView([37.3948, 126.9134], 16);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

function numberedIcon(n) {
  return L.divIcon({
    html: `<div style="background:#4472C4;color:white;border-radius:50%;width:28px;height:28px;
                display:flex;align-items:center;justify-content:center;font-weight:bold;
                font-size:13px;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.4);">${n}</div>`,
    className: '',
    iconSize: [28,28],
    iconAnchor: [14,14]
  });
}

async function loadExcel() {
  try {
    const res = await fetch('community_mapping_photo_list.xlsx');
    if (!res.ok) throw new Error('엑셀 파일을 찾을 수 없습니다.');
    const buf = await res.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws);

    const latlngs = [];
    rows.forEach((r, i) => {
      const lat = r['위도(Lat)'];
      const lng = r['경도(Lng)'];
      const no = r['연번'];
      const time = r['촬영시각'] || '';
      const date = r['촬영일자'] || '';
      const addr = r['주소(오버레이 텍스트)'] || '';
      const file = r['파일명'] || '';

      if (lat == null || lng == null) return;

      latlngs.push([lat, lng]);

      const photoTag = file
        ? `<img src="photos/${file}" onclick="openLightbox(this.src)" onerror="this.outerHTML='<div class=\\'popup-no-photo\\'>사진 없음</div>'" />`
        : `<div class="popup-no-photo">사진 없음</div>`;

      L.marker([lat, lng], { icon: numberedIcon(no) })
        .addTo(map)
        .bindPopup(`
          <div class="popup-content">
            ${photoTag}
            <b>연번 ${no}</b><br/>
            ${date} ${time}<br/>
            ${addr}
          </div>
        `);
    });

    if (latlngs.length > 0) {
      map.fitBounds(latlngs, { padding: [60, 60] });
    }

    const first = rows[0];
    const dateStr = first ? first['촬영일자'] || '' : '';
    document.getElementById('infoText').textContent =
      `엑셀에서 ${rows.length}개 좌표를 불러왔습니다.` + (dateStr ? ` (${dateStr})` : '');
  } catch (e) {
    document.getElementById('infoText').textContent = '엑셀 파일을 불러오지 못했습니다. ' + e.message;
    console.error(e);
  }
}

loadExcel();

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightboxImg').src = '';
}
document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) closeLightbox();
});
window.openLightbox = openLightbox;
window.closeLightbox = closeLightbox;
</script>
</body>
</html>
