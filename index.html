<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>커뮤니티매핑 프로토타입 - 안양천변</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- 네이버 지도 API: YOUR_NAVER_CLIENT_ID 자리에 NCP(네이버 클라우드 플랫폼)에서 발급한 클라이언트 ID를 넣으세요. -->
<script type="text/javascript" src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=ldzn2y3ng1"></script>
<!-- 네이버 지도 공식 마커 클러스터링 유틸리티 (navermaps/marker-tools.js) -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/gh/navermaps/marker-tools.js@master/marker-clustering/src/MarkerClustering.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; font-family: -apple-system, "Malgun Gothic", sans-serif; }
  #map { height: 100%; width: 100%; }
  .info-box {
    position: absolute; top: 10px; left: 50px; z-index: 1000;
    background: white; padding: 10px 16px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25); font-size: 13px; max-width: 260px;
  }
  .info-box h3 { margin: 0 0 6px 0; font-size: 15px; }
  .num-badge {
    background:#4472C4; color:white; border-radius:50%;
    width:22px; height:22px; display:inline-flex; align-items:center;
    justify-content:center; font-weight:bold; font-size:12px; margin-right:6px;
  }
  .popup-content { font-size: 13px; line-height: 1.5; max-width:220px; }
  .popup-content img { width:100%; max-height:400px; object-fit:cover; border-radius:6px; margin-bottom:6px; display:block; cursor:pointer; }
  .popup-content b { color:#4472C4; }
  .popup-no-photo { background:#f0f0f0; color:#888; text-align:center; padding:40px 0; border-radius:6px; margin-bottom:6px; font-size:12px; }
  .padlet-comment { background:#fffde7; border-left:3px solid #fbc02d; padding:6px 8px; margin-top:8px; border-radius:4px; font-size:12px; line-height:1.5; }

  .lightbox { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.85);
    align-items:center; justify-content:center; }
  .lightbox.show { display:flex; }
  .lightbox img { max-width:90vw; max-height:90vh; object-fit:contain; border-radius:4px; }
  .lightbox-close { position:absolute; top:16px; right:20px; color:white; font-size:32px;
    cursor:pointer; line-height:1; user-select:none; }
  .lightbox-close:hover { color:#ccc; }
</style>
</head>
<body>
<div class="info-box">
  <h3>📍 안양3동 안전지도</h3>
  <span id="infoText">엑셀 파일을 불러오는 중...</span>
</div>
<div id="map"></div>
<div id="lightbox" class="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <img id="lightboxImg" src="" alt="확대된 사진"/>
</div>

<script>
// ▼▼ 네이버 지도 설정 ▼▼
var NAVER_CLIENT_ID = 'ldzn2y3ng1'; // ← 여기에 본인의 NCP 클라이언트 ID를 넣으세요 (위 <script src>의 ncpClientId와 동일해야 합니다)
var INIT_CENTER = new naver.maps.LatLng(37.3948, 126.9134); // 안양천
var INIT_ZOOM = 16;
var CLUSTER_MAX_ZOOM = 16;      // 이 줌 레벨 이상으로 확대하면 개별 마커로 표시, 축소하면 클러스터 표시
var CLUSTER_GRID_SIZE = 100;    // 클러스터링 그리드 크기(px). 클수록 더 잘 뭉칩니다.
var CLUSTER_MIN_SIZE = 2;       // 클러스터로 묶을 최소 마커 수

var map = new naver.maps.Map('map', {
  center: INIT_CENTER,
  zoom: INIT_ZOOM,
  scaleControl: true,
  logoControl: true,
  mapDataControl: false,
  zoomControl: true,
  zoomControlOptions: { position: naver.maps.Position.RIGHT_BOTTOM }
});

// 개별 지점 마커 (기존 파란색 번호 마커 유지)
function makeMarkerIcon(n) {
  return {
    content: '<div style="background:#4472C4;color:white;border-radius:50%;width:28px;height:28px;' +
             'display:flex;align-items:center;justify-content:center;font-weight:bold;' +
             'font-size:13px;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.4);">' + n + '</div>',
    size: new naver.maps.Size(28, 28),
    anchor: new naver.maps.Point(14, 14)
  };
}

// 클러스터(그룹) 마커 - 주황색 숫자 원
function makeClusterIcon(count) {
  return {
    content: '<div style="background:#FF8F00;color:white;border-radius:50%;width:36px;height:36px;' +
             'display:flex;align-items:center;justify-content:center;font-weight:bold;' +
             'font-size:15px;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.4);">' + count + '</div>',
    size: new naver.maps.Size(36, 36),
    anchor: new naver.maps.Point(18, 18)
  };
}

var infoWindow = new naver.maps.InfoWindow({
  content: '',
  maxWidth: 240,
  disableAutoPan: true,
  borderWidth: 1,
  borderColor: '#4472C4',
  backgroundColor: '#ffffff',
  anchorSize: new naver.maps.Size(10, 10),
  anchorColor: '#ffffff',
  pixelOffset: new naver.maps.Point(0, -4),
  zIndex: 2000
});

async function loadExcel() {
  try {
    const res = await fetch('community_mapping_photo_list.xlsx');
    if (!res.ok) throw new Error('엑셀 파일을 찾을 수 없습니다.');
    const buf = await res.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws);

    // 기존 위치 데이터(배열)는 그대로 유지하고, 마커는 새로 생성합니다.
    const positions = [];
    const markers = [];

    rows.forEach((r) => {
      const lat = r['위도(Lat)'];
      const lng = r['경도(Lng)'];
      const no = r['연번'];
      const time = r['촬영시각'] || '';
      const date = r['촬영일자'] || '';
      const addr = r['주소(오버레이 텍스트)'] || '';
      const file = r['파일명'] || '';
      const padletComment = r['패들렛댓글'] || '';

      if (lat == null || lng == null) return;

      const position = new naver.maps.LatLng(lat, lng);
      positions.push(position);

      const marker = new naver.maps.Marker({
        position: position,
        icon: makeMarkerIcon(no)
      });

      const photoTag = file
        ? `<img src="photos/${file}" onclick="openLightbox(this.src)" onerror="this.outerHTML='<div class=\\'popup-no-photo\\'>사진 없음</div>'" />`
        : `<div class="popup-no-photo">사진 없음</div>`;

      const commentTag = padletComment
        ? `<div class="padlet-comment"><b>패들렛 댓글</b><br/>${padletComment}</div>`
        : '';

      const popupHtml = `
        <div class="popup-content">
          ${photoTag}
          <b>연번 ${no}</b><br/>
          ${date} ${time}<br/>
          ${addr}
          ${commentTag}
        </div>
      `;

      naver.maps.Event.addListener(marker, 'click', function() {
        infoWindow.setContent(popupHtml);
        infoWindow.open(map, marker);
      });

      markers.push(marker);
    });

    if (positions.length > 0) {
      const bounds = positions.reduce(
        (b, p) => b.extend(p),
        new naver.maps.LatLngBounds(positions[0].clone(), positions[0].clone())
      );
      map.fitBounds(bounds, 60);
    }

    // 마커 클러스터링: 축소 시 인접 마커를 숫자 그룹으로, 확대 시 개별 마커로 표시
    new MarkerClustering({
      minClusterSize: CLUSTER_MIN_SIZE,
      maxZoom: CLUSTER_MAX_ZOOM,
      map: map,
      markers: markers,
      disableClickZoom: false,
      gridSize: CLUSTER_GRID_SIZE,
      icons: [makeClusterIcon(0)],
      stylingFunction: function(clusterMarker, count) {
        clusterMarker.setIcon(makeClusterIcon(count));
      }
    });

    const first = rows[0];
    const dateStr = first ? first['촬영일자'] || '' : '';
    document.getElementById('infoText').textContent =
      `엑셀에서 ${rows.length}개 좌표를 불러왔습니다.` + (dateStr ? ` (${dateStr})` : '');
  } catch (e) {
    document.getElementById('infoText').textContent = '엑셀 파일을 불러오지 못했습니다. ' + e.message;
    console.error(e);
  }
}

loadExcel();

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightboxImg').src = '';
}
document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) closeLightbox();
});
window.openLightbox = openLightbox;
window.closeLightbox = closeLightbox;
</script>
</body>
</html>
